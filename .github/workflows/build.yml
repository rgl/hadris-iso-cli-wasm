name: build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        id: setup-rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: wasm32-wasip1
          toolchain: 1.98.0
          components: clippy, rustfmt
      - name: Checkout Hadris
        uses: actions/checkout@v7
        with:
          # see https://github.com/hxyulin/hadris/releases
          repository: hxyulin/hadris
          ref: v2.1.0 # 2026-08-18T04:54:26Z
          path: hadris
      - name: Set hadris rust version
        working-directory: hadris
        env:
          RUST_VERSION: ${{ steps.setup-rust.outputs.name }}
        run: |
          set -eux
          perl -pi -e "s/^rust-version\s*=.*/rust-version = \"$RUST_VERSION\"/" Cargo.toml
          rm rust-toolchain.toml
          ACTUAL_RUST_VERSION="$(rustc --version | perl -nle 'print $1 if /^rustc (\S+)/')"
          if [[ "$RUST_VERSION" != "$ACTUAL_RUST_VERSION" ]]; then
            echo "ERROR: Expected rust version $RUST_VERSION but got $ACTUAL_RUST_VERSION."
            exit 1
          fi
      - name: Set hadris version
        working-directory: hadris
        run: |
          set -eux
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')"
          else
            VERSION="0.0.0+${GITHUB_SHA:0:7}"
          fi
          perl -pi -e "s/^version(\.workspace)?\s*=.*/version = \"$VERSION\"/" crates/tools/hadris-iso-cli/Cargo.toml
      - name: Build
        working-directory: hadris/crates/tools/hadris-iso-cli
        run: cargo build --package hadris-iso-cli --release --target wasm32-wasip1
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: hadris/target/wasm32-wasip1/release/hadris-iso-cli.wasm
  release:
    if: ${{ startsWith(github.event.ref, 'refs/tags/v') }}
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: hadris-iso-cli.wasm
          token: ${{ secrets.GITHUB_TOKEN }}
