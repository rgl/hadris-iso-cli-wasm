name: build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout Hadris
        uses: actions/checkout@v6
        with:
          # see https://github.com/hxyulin/hadris/tags
          repository: hxyulin/hadris
          ref: a332d5abdf5d113d2a0844cbad29be8f2dd55b87 # 2026-04-29T08:25:10.000Z
          path: hadris
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: wasm32-wasip1
          toolchain: 1.95.0
          components: rust-src
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Set version
        working-directory: hadris
        run: |
          set -eux
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')"
          else
            VERSION="0.0.0+${GITHUB_SHA:0:7}"
          fi
          perl -pi -e "s/^version(\.workspace)?\s*=.*/version = \"$VERSION\"/" crates/hadris-iso-cli/Cargo.toml
      - name: Build
        working-directory: hadris/crates/hadris-iso-cli
        run: cargo build --package hadris-iso-cli --release --target wasm32-wasip1
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: hadris/target/wasm32-wasip1/release/hadris-iso-cli.wasm
  release:
    if: ${{ startsWith(github.event.ref, 'refs/tags/v') }}
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: hadris-iso-cli.wasm
          token: ${{ secrets.GITHUB_TOKEN }}
